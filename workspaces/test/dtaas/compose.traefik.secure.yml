# ⚠️ DEVELOPMENT ONLY - INSECURE CONFIGURATION ⚠️
# This configuration uses Traefik for multi-user scenario.
# The traefik forward-auth is used for user authorization.
# This configuration uses HTTP (not HTTPS) and insecure flags
# for development/testing.
# For production deployments with TLS/HTTPS, use
# compose.traefik.secure.tls.yml instead.

name: dtaas

services:
  traefik:
    image: traefik:v3.6.4
    restart: unless-stopped
    command:
      - "--api.insecure=true"  # DEV ONLY - disable in production
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"  # DEV ONLY
      - "--entrypoints.web.proxyProtocol.insecure=true"  # DEV ONLY
      - "--log.level=DEBUG"  # DEV ONLY - use INFO/WARN in production
    labels:
      - "traefik.http.middlewares.cors.headers.accessControlAllowOriginList=http://localhost,http://host.docker.internal"
      - "traefik.http.middlewares.cors.headers.accessControlAllowMethods=GET,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.routers.myservice.rule=Host(`myservice.localhost`)"
      - "traefik.http.services.myservice.loadbalancer.server.port=80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      frontend:
        aliases:
          - "${SERVER_DNS}"  # Allows other containers on this network to reach Traefik via the public domain name
      users:

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command:
      - "start"
      - "--proxy-headers=xforwarded"
      - "--hostname-strict=false"
      - "--http-relative-path=/auth"
      - "--db=dev-file"
      - "--verbose"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD?KEYCLOAK_ADMIN_PASSWORD_not_set}
      - KC_HOSTNAME=http://${SERVER_DNS}/auth
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.entryPoints=web"
      - "traefik.http.routers.keycloak.rule=Host(`${SERVER_DNS}`) && PathPrefix(`/auth`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - frontend
      - users

  client:
    image: intocps/dtaas-web:latest
    restart: unless-stopped
    volumes:
      - ./config/client.js:/dtaas/client/build/env.js
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.entryPoints=web"
      - "traefik.http.services.client.loadbalancer.server.port=4000"
      - "traefik.http.routers.client.middlewares=oathkeeper-auth"
      - "traefik.http.routers.client.rule=Host(`${SERVER_DNS}`) && PathPrefix(`/`)"
    networks:
      - frontend

  user1:
    image: workspace:latest
    #image: intocps/workspace:latest
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile.ubuntu.noble.xfce
    environment:
      - MAIN_USER=${USERNAME1:-user1}
    volumes:
      - "./files/${USERNAME1:-user1}:/workspace"
      - ./files/common:/workspace/common
    shm_size: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.u1.entryPoints=web"
      - "traefik.http.routers.u1.rule=Host(`${SERVER_DNS}`) && PathPrefix(`/${USERNAME1:-user1}`)"
      - "traefik.http.routers.u1.middlewares=oathkeeper-auth"
    networks:
      - users

  user2:
    image: workspace:latest
    #image: intocps/workspace:latest
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile.ubuntu.noble.xfce
    environment:
      - MAIN_USER=${USERNAME2:-user2}
    volumes:
      - "./files/${USERNAME2:-user2}:/workspace"
      - ./files/common:/workspace/common
    shm_size: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.u2.entryPoints=web"
      - "traefik.http.routers.u2.rule=Host(`${SERVER_DNS}`) && PathPrefix(`/${USERNAME2:-user2}`)"
      - "traefik.http.routers.u2.middlewares=oathkeeper-auth"
    networks:
      - users

  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    restart: unless-stopped
    # Decision API port 4456: Traefik's forwardAuth middleware calls this to validate
    # tokens. On auth failure Oathkeeper returns 302 → login-relay → Keycloak login.
    # Proxy port 4455 also starts but is not used by Traefik in this setup.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        sed \
          -e 's|$${LOGIN_RELAY_URL}|'"$$LOGIN_RELAY_URL"'|g' \
          /etc/oathkeeper/config/oathkeeper.yml > /tmp/oathkeeper.yml &&
        sed \
          -e 's|$${USERNAME1}|'"$$USERNAME1"'|g' \
          -e 's|$${USERNAME2}|'"$$USERNAME2"'|g' \
          /etc/oathkeeper/config/access-rules.yml > /tmp/access-rules.yml &&
        oathkeeper serve -c /tmp/oathkeeper.yml
    volumes:
      # Provides oathkeeper.yml and access-rules.yml to the container.
      - "./oathkeeper:/etc/oathkeeper/config"
    environment:
      - LOGIN_RELAY_URL=http://${SERVER_DNS:-localhost}/login-relay
      # Username path prefixes — substituted into access-rules.yml per-user upstreams.
      - USERNAME1=${USERNAME1:-user1}
      - USERNAME2=${USERNAME2:-user2}
    labels:
      - "traefik.enable=true"
      # Defines the forwardAuth middleware used by all protected routers.
      # Traefik calls http://oathkeeper:4456/decisions with X-Forwarded-* headers;
      # Oathkeeper evaluates access rules and returns 200 (allow) or 302 (redirect).
      # authResponseHeaders copies user-identity headers injected by the header mutator.
      - "traefik.http.middlewares.oathkeeper-auth.forwardauth.address=http://oathkeeper:4456/decisions"
      - "traefik.http.middlewares.oathkeeper-auth.forwardauth.authResponseHeaders=X-User-Name,X-User-Subject,X-User-Groups"
    networks:
      - frontend
      - users
    depends_on:
      keycloak:
        condition: service_healthy
      login-relay:
        condition: service_healthy

  login-relay:
    build:
      context: ./login-relay
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      # Public Keycloak URL — used to build the browser-facing auth redirect.
      - KEYCLOAK_PUBLIC_URL=http://${SERVER_DNS:-localhost}/auth
      # Internal Keycloak URL — used for server-side token exchange.
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - SERVER_DNS=${SERVER_DNS}
      - TLS=false  # DEV ONLY
      # Workspace prefixes — used to detect unknown paths and avoid redirect loops.
      # Add new users here as a comma-separated list; no code changes needed.
      - WORKSPACE_USERS=${WORKSPACE_USERS:-user1,user2}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.login-relay.entryPoints=web"
      - "traefik.http.routers.login-relay.rule=Host(`${SERVER_DNS}`) && (PathPrefix(`/login-relay`) || Path(`/logout`))"
      - "traefik.http.routers.login-relay.middlewares=login-relay-ratelimit"
      - "traefik.http.services.login-relay.loadbalancer.server.port=8080"
      # Rate limit: max 20 login initiations/minute per IP — prevents abuse of the
      # authorization-code login flow. No auth middleware — this path must be publicly reachable.
      - "traefik.http.middlewares.login-relay-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.login-relay-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.login-relay-ratelimit.ratelimit.period=1m"
    networks:
      - frontend
      - users
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  frontend:
    name: dtaas-frontend
  users:
    name: dtaas-users
volumes:
  keycloak-data:
    driver: local
